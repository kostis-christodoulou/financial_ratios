[project]
name = "finstat"
version = "0.1.0"
description = "Local EDGAR financial statement and ratio analysis app."
requires-python = ">=3.9"
dependencies = [
  "duckdb>=1.4.0",
  "pandas>=2.0.0",
  "plotly>=6.8.0",
]

[project.scripts]
finstat = "finstat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

